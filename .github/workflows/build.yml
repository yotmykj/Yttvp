name: Build YTTV-Patcher

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.5'

      - name: Generate clean Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Run tests
        run: ./gradlew test --stacktrace

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: YTTV-Patcher-build
          path: |
            **/build/libs/*
            **/build/distributions/*
          if-no-files-found: warn
